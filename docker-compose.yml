services:
  postgres:
    image: postgres:16-alpine
    container_name: plumora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-plumora_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-plumora_dev_pass_local_only}
      POSTGRES_DB: ${DB_NAME:-plumora_dev}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - plumora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-plumora_app} -d ${DB_NAME:-plumora_dev}"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: plumora-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - plumora_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  db-migrate-seed:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: plumora-db-migrate-seed
    restart: "no"
    command: ["python", "-c", "from app.modules.content.seed_loader import init_db_and_seed; init_db_and_seed()"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${DB_USER:-plumora_app}:${DB_PASSWORD:-plumora_dev_pass_local_only}@postgres:5432/${DB_NAME:-plumora_dev}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-plumora_local_dev_secret_key_min_32_chars_01}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  user-auth-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: plumora-user-auth-service
    restart: unless-stopped
    command: ["uvicorn", "services.user_auth_service:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      MICROSERVICE_MODE: "true"
      DATABASE_URL: postgresql+psycopg://auth_svc_user:${AUTH_DB_PASSWORD:-plumora_dev_pass_local_only}@postgres:5432/${DB_NAME:-plumora_dev}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-plumora_local_dev_secret_key_min_32_chars_01}
      FRONTEND_ORIGIN: http://localhost:${WEB_PORT:-3000}
      CONTENT_SERVICE_URL: http://content-kg-service:8002
      ASSESSMENT_SERVICE_URL: http://assessment-grader-service:8003
    depends_on:
      db-migrate-seed:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8001/health\")'"]
      interval: 4s
      timeout: 4s
      retries: 5

  content-kg-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: plumora-content-kg-service
    restart: unless-stopped
    command: ["uvicorn", "services.content_kg_service:app", "--host", "0.0.0.0", "--port", "8002"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://content_svc_user:${CONTENT_DB_PASSWORD:-plumora_dev_pass_local_only}@postgres:5432/${DB_NAME:-plumora_dev}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-plumora_local_dev_secret_key_min_32_chars_01}
      ASSESSMENT_SERVICE_URL: http://assessment-grader-service:8003
      PLUMORA_LLM_API_URL: ${PLUMORA_LLM_API_URL:-}
      PLUMORA_LLM_API_KEY: ${PLUMORA_LLM_API_KEY:-}
      PLUMORA_LLM_MODEL: ${PLUMORA_LLM_MODEL:-gemini-3.8-flash}
    depends_on:
      db-migrate-seed:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8002/health\")'"]
      interval: 4s
      timeout: 4s
      retries: 5

  assessment-grader-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: plumora-assessment-grader-service
    restart: unless-stopped
    command: ["uvicorn", "services.assessment_grader_service:app", "--host", "0.0.0.0", "--port", "8003", "--workers", "2"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://assess_svc_user:${ASSESS_DB_PASSWORD:-plumora_dev_pass_local_only}@postgres:5432/${DB_NAME:-plumora_dev}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-plumora_local_dev_secret_key_min_32_chars_01}
      CONTENT_SERVICE_URL: http://content-kg-service:8002
      PLUMORA_LLM_API_URL: ${PLUMORA_LLM_API_URL:-}
      PLUMORA_LLM_API_KEY: ${PLUMORA_LLM_API_KEY:-}
      PLUMORA_LLM_MODEL: ${PLUMORA_LLM_MODEL:-gemini-3.8-flash}
    depends_on:
      db-migrate-seed:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8003/health\")'"]
      interval: 4s
      timeout: 4s
      retries: 5

  recommendation-ai-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: plumora-recommendation-ai-service
    restart: unless-stopped
    command: ["uvicorn", "services.recommendation_ai_service:app", "--host", "0.0.0.0", "--port", "8004", "--workers", "4"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://rec_ai_svc_user:${REC_AI_DB_PASSWORD:-plumora_dev_pass_local_only}@postgres:5432/${DB_NAME:-plumora_dev}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-plumora_local_dev_secret_key_min_32_chars_01}
      PLUMORA_CANDIDATES_DIR: /app/rl/artifacts/candidates
      AUTH_SERVICE_URL: http://user-auth-service:8001
      CONTENT_SERVICE_URL: http://content-kg-service:8002
      ASSESSMENT_SERVICE_URL: http://assessment-grader-service:8003
      RECOMMENDATION_SERVICE_URL: http://recommendation-ai-service:8004
    volumes:
      - plumora_rl_candidates:/app/rl/artifacts/candidates
    depends_on:
      db-migrate-seed:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8004/health\")'"]
      interval: 4s
      timeout: 4s
      retries: 5

  api-gateway:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: plumora-api-gateway
    restart: unless-stopped
    command: ["uvicorn", "services.api_gateway:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-plumora_local_dev_secret_key_min_32_chars_01}
      FRONTEND_ORIGIN: http://localhost:${WEB_PORT:-3000}
      AUTH_SERVICE_URL: http://user-auth-service:8001
      CONTENT_SERVICE_URL: http://content-kg-service:8002
      ASSESSMENT_SERVICE_URL: http://assessment-grader-service:8003
      RECOMMENDATION_SERVICE_URL: http://recommendation-ai-service:8004
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      user-auth-service:
        condition: service_healthy
      content-kg-service:
        condition: service_healthy
      assessment-grader-service:
        condition: service_healthy
      recommendation-ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/api/v1/health\")'"]
      interval: 4s
      timeout: 4s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: plumora-frontend
    restart: unless-stopped
    environment:
      API_UPSTREAM_URL: ${API_UPSTREAM_URL:-http://api-gateway:8000}
    ports:
      - "${WEB_PORT:-3000}:8080"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 4s
      timeout: 4s
      retries: 5

volumes:
  plumora_pgdata:
  plumora_redisdata:
  plumora_rl_candidates:
