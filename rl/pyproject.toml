[project]
name = "plumora-rl"
version = "0.1.0"
description = "Plumora Offline Reinforcement Learning Simulator & DQN Pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gymnasium>=1.0.0",
    "numpy>=2.0.0",
    "torch>=2.5.0",
    "stable-baselines3>=2.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
