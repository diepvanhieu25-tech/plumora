name: Plumora Day-0 CI Pipeline

on:
  push:
    branches: [main, "feat/**", "fix/**", "refactor/**"]
  pull_request:
    branches: [main]

jobs:
  unit-and-static:
    name: Static Checks & Unit Tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/rl/src
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: plumora_app
          POSTGRES_PASSWORD: plumora_dev_pass_local_only
          POSTGRES_DB: plumora_dev
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U plumora_app -d plumora_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv and Python 3.12
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Backend, RL, and Frontend dependencies
        run: |
          cd backend && uv sync --frozen
          cd ../rl && uv sync --frozen
          cd ../frontend && npm ci

      - name: 1. Lint, SAST & Format Check (Ruff + Bandit Rules, ESLint, npm audit, Git Diff)
        run: |
          cd backend && uv run ruff check .
          cd ../rl && uv run ruff check .
          cd ../frontend && npm run lint && npm audit --omit=dev --audit-level=high
          cd .. && git diff --check

      - name: 2. Type Check (Mypy & TypeScript)
        run: |
          cd backend && uv run mypy app services tests
          cd ../rl && uv run mypy src tests
          cd ../frontend && npm run typecheck

      - name: 3. Unit & Behavioral Tests
        env:
          DATABASE_URL: postgresql+psycopg://plumora_app:plumora_dev_pass_local_only@127.0.0.1:5432/plumora_test
          PLUMORA_TEST_DB_NAME: plumora_test
          REDIS_URL: redis://127.0.0.1:6379/1
        run: |
          cd backend && uv run pytest
          cd ../rl && uv run pytest
          cd ../frontend && npm run test:unit

      - name: 4. Frontend Production Build & K8s Manifest Validation
        run: |
          cd frontend && npm run build
          cd ../backend && uv run python -c "import glob, yaml; [list(yaml.safe_load_all(open(f))) for f in glob.glob('../k8s/*.yaml')]; print('k8s YAML valid')"

  docker-e2e-and-security:
    name: Live Docker Microservices E2E & Edge Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend dependencies for Integration & E2E
        run: |
          cd frontend && npm ci

      - name: 5. Start Unified Docker 4-Microservices + API Gateway + Frontend Stack
        run: |
          docker compose config --quiet
          docker compose up -d --build --remove-orphans
          echo "Waiting up to 90s for API Gateway (:8000) & Frontend (:3000) readiness..."
          STACK_READY=0
          for i in $(seq 1 90); do
            GW_HEALTH=$(curl -sf http://127.0.0.1:8000/api/v1/health 2>/dev/null || true)
            FE_READY=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:3000 2>/dev/null || true)
            if echo "$GW_HEALTH" | grep -q '"mode":"microservices"' && echo "$GW_HEALTH" | grep -q '"status":"ok"' && [ "$FE_READY" = "200" ]; then
              echo "Live Docker Microservices stack is healthy after ${i}s."
              STACK_READY=1
              break
            fi
            sleep 1
          done
          if [ "$STACK_READY" -ne 1 ]; then
            echo "FATAL: Docker Microservices stack failed to become healthy within 90s."
            docker compose ps
            docker compose logs --tail=50
            exit 1
          fi

      - name: 6. Live Fullstack Integration Test (jsdom)
        run: |
          cd frontend && npm run test:integration

      - name: 7. Real Browser E2E Audit & Negative Control
        env:
          FRONTEND_BASE_URL: http://localhost:3000
          BACKEND_BASE_URL: http://127.0.0.1:8000
        run: |
          cd frontend
          npx playwright install --with-deps chromium
          cd ..
          node scripts/audit_p3_slice1.cjs
          echo "Running negative-control audit verification in CI..."
          if node scripts/audit_p3_slice1.cjs --negative-control > /dev/null 2>&1; then
            echo "FATAL: Negative-control probe unexpectedly passed!"
            exit 1
          else
            echo "Negative-control probe correctly failed with non-zero exit code as expected."
          fi

      - name: 8. Edge Security Probes
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v2/internal/domains/frontend/bundle)" = "403"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/v2/internal/domains/frontend/bundle)" = "403"
          test "$(curl -s --path-as-is -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8000/api/v2/domains/%25252e%25252e/%25252e%25252e/health')" = "400"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/roadmap)" = "404"
          GW_RID=$(curl -sI -H "X-Request-ID: ci-trace-001" http://127.0.0.1:8000/api/v1/health | tr -d '\r' | grep -i "^x-request-id:" | awk '{print $2}')
          test "$GW_RID" = "ci-trace-001"
