name: Plumora Day-0 CI Pipeline

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: plumora_app
          POSTGRES_PASSWORD: plumora_dev_pass_local_only
          POSTGRES_DB: plumora_dev
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U plumora_app -d plumora_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv and Python 3.12
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Backend, RL, and Frontend dependencies
        run: |
          cd backend && uv sync --frozen
          cd ../rl && uv sync --frozen
          cd ../frontend && npm ci

      - name: 1. Lint & Format Check (Ruff & ESLint)
        run: |
          cd backend && uv run ruff check .
          cd ../rl && uv run ruff check .
          cd ../frontend && npm run lint

      - name: 2. Type Check (Mypy & TypeScript)
        run: |
          cd backend && uv run mypy app tests
          cd ../rl && uv run mypy src tests
          cd ../frontend && npm run typecheck

      - name: 3. Automated Smoke & Behavioral Tests
        env:
          DATABASE_URL: postgresql+psycopg://plumora_app:plumora_dev_pass_local_only@127.0.0.1:5432/plumora_dev
          REDIS_URL: redis://127.0.0.1:6379/0
        run: |
          cd backend && uv run pytest
          cd ../rl && uv run pytest
          cd ../frontend && npm test -- --run

      - name: 4. Build Verification
        run: |
          cd frontend && npm run build
