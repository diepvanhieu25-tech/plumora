name: Plumora Day-0 CI Pipeline

on:
  push:
    branches: [main, "feat/**", "fix/**", "refactor/**"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/rl/src
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: plumora_app
          POSTGRES_PASSWORD: plumora_dev_pass_local_only
          POSTGRES_DB: plumora_dev
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U plumora_app -d plumora_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv and Python 3.12
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Backend, RL, and Frontend dependencies
        run: |
          cd backend && uv sync --frozen
          cd ../rl && uv sync --frozen
          cd ../frontend && npm ci

      - name: 1. Lint & Format Check (Ruff, ESLint, Git Diff)
        run: |
          cd backend && uv run ruff check .
          cd ../rl && uv run ruff check .
          cd ../frontend && npm run lint
          cd .. && git diff --check

      - name: 2. Type Check (Mypy & TypeScript)
        run: |
          cd backend && uv run mypy app services tests
          cd ../rl && uv run mypy src tests
          cd ../frontend && npm run typecheck

      - name: 3. Unit & Mock Behavioral Tests
        env:
          DATABASE_URL: postgresql+psycopg://plumora_app:plumora_dev_pass_local_only@127.0.0.1:5432/plumora_test
          PLUMORA_TEST_DB_NAME: plumora_test
          REDIS_URL: redis://127.0.0.1:6379/1
        run: |
          cd backend && uv run pytest
          cd ../rl && uv run pytest
          cd ../frontend && npm run test:unit

      - name: 4. Frontend Production Build Verification
        run: |
          cd frontend && npm run build

      - name: 5. Start Backend Server & Verify Health Probe
        env:
          DATABASE_URL: postgresql+psycopg://plumora_app:plumora_dev_pass_local_only@127.0.0.1:5432/plumora_dev
          REDIS_URL: redis://127.0.0.1:6379/0
          APP_ENV: development
          PYTHONPATH: ../rl/src
        run: |
          cd backend
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          echo "Waiting up to 30s for backend readiness at http://127.0.0.1:8000/api/v1/health..."
          HEALTHY=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/v1/health > /dev/null 2>&1; then
              echo "Backend is healthy after ${i}s."
              HEALTHY=1
              break
            fi
            sleep 1
          done
          if [ "$HEALTHY" -ne 1 ]; then
            echo "FATAL: Backend failed to become healthy within 30s"
            exit 1
          fi

      - name: 6. Live Fullstack Integration Test (jsdom)
        run: |
          cd frontend && npm run test:integration

      - name: 7. Start Frontend & Run Real Browser E2E Audit
        env:
          FRONTEND_BASE_URL: http://127.0.0.1:3000
          BACKEND_BASE_URL: http://127.0.0.1:8000
        run: |
          cd frontend
          npx playwright install --with-deps chromium
          npx vite preview --host 127.0.0.1 --port 3000 &
          echo "Waiting up to 20s for frontend readiness at http://127.0.0.1:3000..."
          FE_HEALTHY=0
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:3000 > /dev/null 2>&1; then
              echo "Frontend preview is healthy after ${i}s."
              FE_HEALTHY=1
              break
            fi
            sleep 1
          done
          if [ "$FE_HEALTHY" -ne 1 ]; then
            echo "FATAL: Frontend preview failed to become healthy within 20s"
            exit 1
          fi
          cd ..
          node scripts/audit_p3_slice1.cjs
          echo "Running negative-control audit verification in CI..."
          if node scripts/audit_p3_slice1.cjs --negative-control > /dev/null 2>&1; then
            echo "FATAL: Negative-control probe unexpectedly passed!"
            exit 1
          else
            echo "Negative-control probe correctly failed with non-zero exit code as expected."
          fi

      - name: 8. Validate Docker Compose Configuration
        run: |
          docker compose config --quiet
          docker compose --profile microservices config --quiet
