apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-ai-service
  namespace: plumora
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recommendation-ai-service
  template:
    metadata:
      labels:
        app: recommendation-ai-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: recommendation-ai-service
          image: plumora-backend:4.0.0
          command: ["uvicorn", "services.recommendation_ai_service:app", "--host", "0.0.0.0", "--port", "8004"]
          ports:
            - containerPort: 8004
          env:
            - name: MICROSERVICE_MODE
              value: "true"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: plumora-secrets
                  key: rec-ai-database-url
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: plumora-secrets
                  key: jwt-secret-key
            - name: AUTH_SERVICE_URL
              value: "http://user-auth-service:8001"
            - name: CONTENT_SERVICE_URL
              value: "http://content-kg-service:8002"
            - name: ASSESSMENT_SERVICE_URL
              value: "http://assessment-grader-service:8003"
            - name: RECOMMENDATION_SERVICE_URL
              value: "http://recommendation-ai-service:8004"
          volumeMounts:
            - name: rl-candidates
              mountPath: /app/rl/artifacts/candidates
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8004
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8004
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: rl-candidates
          persistentVolumeClaim:
            claimName: plumora-rl-candidates-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: recommendation-ai-service
  namespace: plumora
spec:
  selector:
    app: recommendation-ai-service
  ports:
    - port: 8004
      targetPort: 8004
---
