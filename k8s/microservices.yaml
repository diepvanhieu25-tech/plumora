apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-auth-service
  namespace: plumora
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-auth-service
  template:
    metadata:
      labels:
        app: user-auth-service
    spec:
      containers:
        - name: user-auth-service
          image: plumora-backend:2.0.0
          command: ["uvicorn", "services.user_auth_service:app", "--host", "0.0.0.0", "--port", "8001"]
          ports:
            - containerPort: 8001
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: user-auth-service
  namespace: plumora
spec:
  selector:
    app: user-auth-service
  ports:
    - port: 8001
      targetPort: 8001
---
