apiVersion: apps/v1
kind: Deployment
metadata:
  name: assessment-grader-service
  namespace: plumora
spec:
  replicas: 1
  selector:
    matchLabels:
      app: assessment-grader-service
  template:
    metadata:
      labels:
        app: assessment-grader-service
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: assessment-grader-service
          image: plumora-backend:2.0.0
          command: ["uvicorn", "services.assessment_grader_service:app", "--host", "0.0.0.0", "--port", "8003"]
          ports:
            - containerPort: 8003
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
