apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plumora-rl-candidates-pvc
  namespace: plumora
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate-seed
  namespace: plumora
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: db-migrate-seed
          image: plumora-backend:4.0.0
          command: ["sh", "-c", "alembic upgrade head && python -m app.modules.content.seed_loader"]
          env:
            - name: APP_ENV
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: plumora-secrets
                  key: db-admin-url
            - name: AUTH_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: plumora-secrets
                  key: auth-db-password
            - name: CONTENT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: plumora-secrets
                  key: content-db-password
            - name: ASSESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: plumora-secrets
                  key: assess-db-password
            - name: REC_AI_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: plumora-secrets
                  key: rec-ai-db-password
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: plumora-secrets
                  key: jwt-secret-key
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-auth-service
  namespace: plumora
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-auth-service
  template:
    metadata:
      labels:
        app: user-auth-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: user-auth-service
          image: plumora-backend:4.0.0
          command: ["uvicorn", "services.user_auth_service:app", "--host", "0.0.0.0", "--port", "8001"]
          ports:
            - containerPort: 8001
          env:
            - name: MICROSERVICE_MODE
              value: "true"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: plumora-secrets
                  key: auth-database-url
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: plumora-secrets
                  key: jwt-secret-key
            - name: CONTENT_SERVICE_URL
              value: "http://content-kg-service:8002"
            - name: ASSESSMENT_SERVICE_URL
              value: "http://assessment-grader-service:8003"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8001
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8001
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: user-auth-service
  namespace: plumora
spec:
  selector:
    app: user-auth-service
  ports:
    - port: 8001
      targetPort: 8001
---
