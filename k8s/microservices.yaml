          image: plumora-backend:4.0.0
          command: ["uvicorn", "services.api_gateway:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          env:
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: AUTH_SERVICE_URL
              value: "http://user-auth-service:8001"
            - name: CONTENT_SERVICE_URL
              value: "http://content-kg-service:8002"
            - name: ASSESSMENT_SERVICE_URL
              value: "http://assessment-grader-service:8003"
            - name: RECOMMENDATION_SERVICE_URL
              value: "http://recommendation-ai-service:8004"
