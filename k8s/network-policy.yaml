apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: assessment-grader-sandbox-isolation
  namespace: plumora
spec:
  podSelector:
    matchLabels:
      app: assessment-grader-service
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              app: content-kg-service
      ports:
        - protocol: TCP
          port: 8002
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
