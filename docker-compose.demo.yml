# =====================================================================
# Plumora — Local Full-Stack Demo Compose (DEFENSE-01 / Gate 4)
# Starts PostgreSQL 16, Redis 7, FastAPI Backend (DQN Serving) & Nginx Frontend
# Usage:
#   docker compose -f docker-compose.demo.yml up --build -d
#   Open web UI: http://localhost:3000
#   Open API doc: http://localhost:8000/docs
# =====================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: plumora-demo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-plumora_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-plumora_demo_pass_local}
      POSTGRES_DB: ${DB_NAME:-plumora_dev}
    ports:
      - "${DEMO_DB_PORT:-5432}:5432"
    volumes:
      - plumora_demo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-plumora_app} -d ${DB_NAME:-plumora_dev}"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: plumora-demo-redis
    restart: unless-stopped
    ports:
      - "${DEMO_REDIS_PORT:-6379}:6379"
    volumes:
      - plumora_demo_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: plumora-demo-backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${DB_USER:-plumora_app}:${DB_PASSWORD:-plumora_demo_pass_local}@postgres:5432/${DB_NAME:-plumora_dev}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-plumora_defense_demo_jwt_secret_key_2026_super_secure}
      FRONTEND_ORIGIN: http://localhost:${DEMO_WEB_PORT:-3000}
    ports:
      - "${DEMO_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/api/v1/health\")'"]
      interval: 4s
      timeout: 4s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: plumora-demo-frontend
    restart: unless-stopped
    ports:
      - "${DEMO_WEB_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  plumora_demo_pgdata:
  plumora_demo_redisdata:
